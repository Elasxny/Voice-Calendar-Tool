name: voice_calendar_tool
description: A voice-powered calendar management tool
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 语音识别
  speech_to_text: ^6.5.0
  # 文字转语音
  flutter_tts: ^3.8.5
  # 日历集成
  table_calendar: ^3.0.0
  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # 网络请求
  http: ^1.0.0
  # 状态管理
  provider: ^6.0.5
  # 时间处理
  intl: 0.20.2
  # 路由管理
  go_router: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  build_runner: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/